services:
  inbox-pilot:
    build:
      context: .
    env_file:
      - .env
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./data/private:/app/data/private
      - ./config:/app/config:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8765/api/v1/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

